bind_addr = "127.0.0.1:3000"

[credentials]
lock_server_secret_key = "~/.pubky-lock/secret.sess"
lock_server_public_key = "<derived-on-first-run>"
max_ttl_seconds = 900

[database]
url_env = "PUBKY_LOCK_DATABASE_URL"
max_connections = 10
run_migrations_on_startup = true

[worker]
enabled = true
poll_interval_ms = 250
claim_timeout_seconds = 60
worker_id = "default-worker"

[runtime]
environment = "development"

[paykit]
server_url = "http://127.0.0.1:3001"
minimum_confirmations = 0

[creator_authority_acquisition]
enabled = true
method = "legacy-connect"
frontend_session_ttl_seconds = 86400
frontend_session_code_ttl_seconds = 120

[creator_authority_acquisition.legacy_connect]
allowed_return_origins = ["http://localhost:3000"]

[secrets]
creator_authority_key_env = "PUBKY_LOCK_CREATOR_AUTH_ENCRYPTION_KEY"

[logging]
level = "info"

[pubky]
network = "testnet"
resolution = "default"
# pkarr_relays = ["http://127.0.0.1:15411"]

[pkdns]
# Public endpoint data published in the Lock Server PKARR record.
# Operators must configure these for reachable production deployments; Locks does not auto-detect them.
public_ip = "127.0.0.1"
public_pubky_tls_port = 6287
public_icann_http_port = 80
icann_domain = "localhost"
key_republisher_interval_seconds = 3600

[rate_limits]
# trusted_proxy_hops = 2 # Leave unset until PUBKY_LOCK_LOG_FORWARDED_HOP_COUNT=1 shows the hop count. Unset or 0 keeps the public status limit off. The TCP peer is never the key. X-Real-IP is ignored.

[rate_limits.verification_submission]
enabled = true
max_requests = 60
window_seconds = 60

[rate_limits.public_authority_status]
enabled = true
max_requests = 120
window_seconds = 60

[authority_revalidation]
enabled = true
stale_after_hours = 6
batch_size = 4
concurrency = 1
stagger_ms = 1000
poll_interval_seconds = 60
retry_base_seconds = 3600
retry_cap_hours = 24

[content_locks]
max_resource_bytes = 10_000_000
max_resources = 10
max_total_resource_bytes = 100_000_000
